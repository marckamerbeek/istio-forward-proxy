name: Performance Test

on:
  push:
    branches: [ "master" ]
    paths:
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "scripts/perf-test.sh"
      - "scripts/perf/**"
      - ".github/workflows/perf-test.yml"
  pull_request:
    branches: [ "master" ]
    paths:
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "scripts/perf-test.sh"
      - "scripts/perf/**"
      - ".github/workflows/perf-test.yml"
  workflow_dispatch: {}

jobs:
  perf-test:
    name: Load test forward path
    runs-on: ubuntu-latest

    env:
      # Track the istio.io/client-go version pinned in go.mod — the ServiceEntry
      # CRD is stable across an Istio minor line, so this rarely needs bumping.
      ISTIO_CHART_VERSION: "1.30.4"

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # 1. A real Kubernetes API is required: the proxy's ServiceEntry watcher
      #    needs somewhere to list/watch against (see scripts/perf-test.sh).
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: forward-proxy-perf
          wait: 90s

      - name: Set up Helm
        uses: azure/setup-helm@v5

      # 2. Install only the Istio CRDs (ServiceEntry among them) — no sidecars
      #    or control plane needed, just the API types the watcher depends on.
      - name: Install Istio base CRDs
        run: |
          helm repo add istio https://istio-release.storage.googleapis.com/charts
          helm repo update
          helm install istio-base istio/base \
            --namespace istio-system --create-namespace \
            --version "$ISTIO_CHART_VERSION" \
            --wait

      - name: Set up k6
        uses: grafana/setup-k6-action@v1

      - name: Run performance test
        env:
          SUMMARY_EXPORT: ${{ github.workspace }}/k6-summary.json
        run: ./scripts/perf-test.sh

      - name: Publish k6 summary
        if: always() && hashFiles('k6-summary.json') != ''
        run: |
          {
            echo "## k6 performance summary"
            echo '```json'
            jq '{
              requests: .metrics.http_reqs.values.count,
              failed_rate: .metrics.http_req_failed.values.rate,
              duration_avg_ms: .metrics.http_req_duration.values.avg,
              duration_p95_ms: .metrics.http_req_duration.values["p(95)"],
              duration_p99_ms: .metrics.http_req_duration.values["p(99)"]
            }' k6-summary.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload k6 summary artifact
        if: always() && hashFiles('k6-summary.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: k6-summary
          path: k6-summary.json
