name: Build, Scan and Push to DockerHub

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-push:
    name: Build, Scan and Push
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    # 1. Log in to DockerHub using secure repository secrets
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # 2. Set up Docker Buildx (makes building faster and more efficient)
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 3. Build the image locally in the runner so we can scan it first
    - name: Build Docker Image locally
      uses: docker/build-push-action@v5
      with:
        context: .
        load: true # Loads the image locally into the runner for the scan step
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/mijn-applicatie:latest

    # 4. THE SECURITY GATE: Scan the local Docker image with Trivy before pushing
    - name: Scan Docker Image (Security Gate)
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/mijn-applicatie:latest'
        format: 'table'
        exit-code: '1' # CRITICAL: Fails the build immediately if high/critical vulnerabilities are found!
        severity: 'CRITICAL,HIGH'

    # 5. Only push the image to DockerHub if all previous steps (including the scan) passed
    - name: Push Image to Docker Hub
      if: success() # Only runs if the security scan returns a green/successful status
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/mijn-applicatie:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/mijn-applicatie:${{ github.sha }}
