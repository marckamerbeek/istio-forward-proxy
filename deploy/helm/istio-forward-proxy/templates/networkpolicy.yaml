{{- if .Values.networkPolicies.egressFromProxy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "forward-proxy.fullname" . }}-egress
  labels:
    {{- include "forward-proxy.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "forward-proxy.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    {{- if .Values.networkPolicies.egressFromProxy.allowDNS }}
    # DNS to kube-dns / coredns
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- end }}
    # Kubernetes API server (for ServiceEntry watch)
    - to:
        - ipBlock:
            # cluster-admin moet dit evt. aanpassen voor eigen API CIDR
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    # Upstream proxy chain
    - to:
        {{- range .Values.networkPolicies.egressFromProxy.upstreamCIDRs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
        {{- if not .Values.networkPolicies.egressFromProxy.upstreamCIDRs }}
        # No CIDR restriction — cluster-admin should restrict this in production
        - ipBlock:
            cidr: 0.0.0.0/0
        {{- end }}
      ports:
        {{- range .Values.networkPolicies.egressFromProxy.upstreamPorts }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
{{- end }}
---
{{- if .Values.networkPolicies.ingressToProxy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "forward-proxy.fullname" . }}-ingress
  labels:
    {{- include "forward-proxy.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "forward-proxy.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- range .Values.networkPolicies.ingressToProxy.allowFromNamespaces }}
        {{- if eq . "*" }}
        - namespaceSelector: {}
        {{- else }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ (split ":" .Values.proxy.listenAddr)._1 | int }}
    # Kubelet health probes. Kubelet has no pod/namespace identity to scope a
    # `from:` selector to, so this port is reachable from any pod in the
    # cluster — same as with any Service exposing /metrics for Prometheus.
    # /debug/allowlist (which dumps every team's ServiceEntry-derived ACL,
    # unlike /metrics or /healthz|/readyz) is restricted to loopback callers
    # in-app (cmd/main.go's isLoopback check) specifically because this port
    # can't be scoped at the network layer.
    - ports:
        - protocol: TCP
          port: {{ (split ":" .Values.proxy.metricsAddr)._1 | int }}
{{- end }}
