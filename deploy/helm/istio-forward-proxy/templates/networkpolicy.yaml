{{- if .Values.networkPolicies.egressFromProxy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "forward-proxy.fullname" . }}-egress
  labels:
    {{- include "forward-proxy.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "forward-proxy.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    {{- if .Values.networkPolicies.egressFromProxy.allowDNS }}
    # DNS to kube-dns / coredns
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- end }}
    # Kubernetes API server (for ServiceEntry watch)
    #
    # On Cilium specifically: this ipBlock rule does NOT actually grant
    # access, even though it looks maximally permissive. Cilium resolves
    # the API server's real backend to its own reserved `kube-apiserver`
    # identity, and ipBlock/CIDR rules only ever match "world" (external)
    # traffic — never a reserved identity, regardless of CIDR breadth. On
    # Cilium this silently manifests as the ServiceEntry watcher hanging
    # forever on its initial List call ("waiting for ServiceEntry cache
    # sync" with no further log output, /readyz never returns ok). See
    # docs/EGRESS-ENFORCEMENT.md#cilium-ipblock-does-not-reach-cluster-internal-destinations
    # for the fix (a supplementary CiliumNetworkPolicy).
    - to:
        - ipBlock:
            # cluster-admin moet dit evt. aanpassen voor eigen API CIDR
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    # Upstream proxy chain
    #
    # On Cilium: same caveat as above, but broader — ipBlock/CIDR rules
    # never match ANY cluster-internal pod destination on Cilium, not just
    # reserved identities like kube-apiserver. If your upstream proxy
    # (proxy.upstream.host) is itself a Service in this cluster rather
    # than a genuinely external host, this rule will not reach it either;
    # see the same doc section for a working CiliumNetworkPolicy
    # (toEndpoints) example.
    - to:
        {{- range .Values.networkPolicies.egressFromProxy.upstreamCIDRs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
        {{- if not .Values.networkPolicies.egressFromProxy.upstreamCIDRs }}
        # No CIDR restriction — cluster-admin should restrict this in production
        - ipBlock:
            cidr: 0.0.0.0/0
        {{- end }}
      ports:
        {{- range .Values.networkPolicies.egressFromProxy.upstreamPorts }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
{{- end }}
---
{{- if .Values.networkPolicies.ingressToProxy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "forward-proxy.fullname" . }}-ingress
  labels:
    {{- include "forward-proxy.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "forward-proxy.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- range .Values.networkPolicies.ingressToProxy.allowFromNamespaces }}
        {{- if eq . "*" }}
        - namespaceSelector: {}
        {{- else }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ (split ":" .Values.proxy.listenAddr)._1 | int }}
    # Kubelet health probes. Kubelet has no pod/namespace identity to scope a
    # `from:` selector to, so this port is reachable from any pod in the
    # cluster — same as with any Service exposing /metrics for Prometheus.
    # /debug/allowlist (which dumps every team's ServiceEntry-derived ACL,
    # unlike /metrics or /healthz|/readyz) is restricted to loopback callers
    # in-app (cmd/main.go's isLoopback check) specifically because this port
    # can't be scoped at the network layer.
    - ports:
        - protocol: TCP
          port: {{ (split ":" .Values.proxy.metricsAddr)._1 | int }}
{{- end }}
